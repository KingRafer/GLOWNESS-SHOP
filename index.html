<head>

<meta name="theme-color" content="#f6f5fc" media="(prefers-color-scheme: light)">

<!-- Mobile / PWA -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<link rel="icon" type="image/png" sizes="512x512" href="assets/img/icon-512.png">

<!-- Performance: preconnect + preload critical assets -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://ptfsmglrxusiowjkgwov.supabase.co" crossorigin>
<link rel="dns-prefetch" href="https://ptfsmglrxusiowjkgwov.supabase.co">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preload" href="assets/css/styles.css?v=1.5.3-speed" as="style">
<link rel="preload" href="assets/app.js?v=1.5.3-speed" as="script">
<link rel="preload" href="assets/img/logo-sm.png" as="image">

<title>GLOWNESS SHOP — Belanja Jadi Peluang Bisnis</title>
<link rel="stylesheet" href="assets/css/styles.css?v=1.5.3-speed">
<script>
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('glowness_theme')||'dark')}catch(e){}
</script>
<style>
/* Critical above-the-fold: prevent white flash + instant loading state */
html,body{margin:0;background:#0b0b14;color:#f4f3ff}
html[data-theme="light"],html[data-theme="light"] body{background:#f7f6fc;color:#14141f}
#app{min-height:100vh}
.boot-loader{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;font-size:14px;opacity:.55}
</style>
</head>
<body>
<div id="app"><div class="boot-loader">Memuat GLOWNESS SHOP…</div></div>

<!-- Defer non-critical third-party; app.js is critical path -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
<script src="assets/app.js?v=1.5.3-speed" defer></script>

<!-- PWA Service Worker + Install Prompt -->
<script>
(function(){
  if (!('serviceWorker' in navigator)) return;

  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js')
      .then(function(reg){ console.log('[PWA] SW registered', reg.scope); })
      .catch(function(err){ console.warn('[PWA] SW failed', err); });
  });

  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    window.__glownessInstallPrompt = deferredPrompt;
  });

  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
    window.__glownessInstallPrompt = null;
  });
})();
</script>
</body>
</html>
