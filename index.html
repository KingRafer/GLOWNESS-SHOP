<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="GLOWNESS SHOP — belanja jadi peluang bisnis. Ubah pengeluaran menjadi pemasukan bersama para seller.">
<meta name="theme-color" content="#0f0f1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5fc" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">

<!-- PWA / Installable App -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GLOWNESS">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/img/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="assets/img/icon-512.png">

<title>GLOWNESS SHOP — Belanja Jadi Peluang Bisnis</title>
<!-- ?v= ganti angka setiap deploy agar HP tidak pakai cache lama -->
<link rel="stylesheet" href="assets/css/styles.css?v=1.3.0-pwa">
<script>
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('glowness_theme')||'dark')}catch(e){}
</script>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="assets/js/app.js?v=1.3.0-pwa" defer></script>

<!-- PWA Service Worker Registration + Install Prompt -->
<script>
(function(){
  if (!('serviceWorker' in navigator)) return;

  // Register SW
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/sw.js')
      .then(function(reg){ console.log('[PWA] SW registered', reg.scope); })
      .catch(function(err){ console.warn('[PWA] SW failed', err); });
  });

  // Capture install prompt so we can show a custom button later if needed
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    window.__glownessInstallPrompt = deferredPrompt;
  });

  window.addEventListener('appinstalled', function(){
    deferredPrompt = null;
    window.__glownessInstallPrompt = null;
    console.log('[PWA] App installed');
  });
})();
</script>
</body>
</html>
